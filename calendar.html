<!DOCTYPE html>

<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Taskify | Calendar</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus_Jakarta_Sans:wght@600;700;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-background text-on-surface antialiased min-h-screen">
    <!-- TopNavBar -->
    <header class="fixed top-0 w-full z-50 bg-slate-50/80 backdrop-blur-xl flex justify-between items-center px-6 py-4 border-b border-surface-container">
        <div class="flex items-center gap-4">
            <a href="index.html" class="text-2xl font-bold tracking-tighter text-indigo-600 font-['Plus_Jakarta_Sans']">Taskify</a>
        </div>
        <div class="flex items-center gap-6">
            <div class="hidden md:flex items-center gap-8">
                <a class="text-slate-500 font-medium hover:text-indigo-500 transition-colors" href="index.html">Home</a>
                <a class="text-slate-500 font-medium hover:text-indigo-500 transition-colors" href="tasks.html">Tasks</a>
                <a class="text-indigo-600 font-bold border-b-2 border-indigo-600" href="calendar.html">Calendar</a>
                <a class="text-slate-500 font-medium hover:text-indigo-500 transition-colors" href="profile.html">Profile</a>
            </div>
            <div class="flex items-center gap-3">
                <a href="profile.html" class="relative z-[1001]">
                    <img alt="Student Profile Avatar" class="w-10 h-10 rounded-full object-cover ring-2 ring-primary-container" src="https://drive.google.com/file/d/1AECiq_Z_m529xJhhvwaDDR2fPeW4zWkn/view?usp=drive_link"/>
                </a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="pt-24 pb-20 md:pb-8 px-4 md:px-8 lg:px-12 transition-all duration-300">
        <!-- Calendar Header -->
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-6 mb-8 max-w-7xl mx-auto">
            <div>
                <h1 class="text-4xl md:text-5xl font-extrabold tracking-tight mb-2 text-on-surface font-headline">Calendar of Activities</h1>
                <p class="text-on-surface-variant font-medium">Plan your semester, track deadlines, and never miss an important date.</p>
            </div>
            <div class="flex items-center gap-3">
                <button id="prev-month-btn" class="flex items-center gap-2 px-4 py-2 bg-surface-container-low hover:bg-surface-container-high rounded-full text-sm font-semibold transition-colors">
                    <span class="material-symbols-outlined text-sm" data-icon="chevron_left">chevron_left</span>
                </button>
                <span id="current-month-display" class="text-lg font-bold text-on-surface px-4 min-w-[160px] text-center">March 2026</span>
                <button id="next-month-btn" class="flex items-center gap-2 px-4 py-2 bg-surface-container-low hover:bg-surface-container-high rounded-full text-sm font-semibold transition-colors">
                    <span class="material-symbols-outlined text-sm" data-icon="chevron_right">chevron_right</span>
                </button>
            </div>
        </div>

        <!-- Calendar Grid -->
        <div id="calendar-container" class="bg-surface-container-lowest rounded-3xl p-4 md:p-6 shadow-sm max-w-7xl mx-auto">
            <!-- Week Days Header -->
            <div class="grid grid-cols-7 gap-1 md:gap-2 mb-2 md:mb-4">
                <div class="text-center text-[10px] md:text-xs font-bold uppercase tracking-wider text-on-surface-variant py-2">Sun</div>
                <div class="text-center text-[10px] md:text-xs font-bold uppercase tracking-wider text-on-surface-variant py-2">Mon</div>
                <div class="text-center text-[10px] md:text-xs font-bold uppercase tracking-wider text-on-surface-variant py-2">Tue</div>
                <div class="text-center text-[10px] md:text-xs font-bold uppercase tracking-wider text-on-surface-variant py-2">Wed</div>
                <div class="text-center text-[10px] md:text-xs font-bold uppercase tracking-wider text-on-surface-variant py-2">Thu</div>
                <div class="text-center text-[10px] md:text-xs font-bold uppercase tracking-wider text-on-surface-variant py-2">Fri</div>
                <div class="text-center text-[10px] md:text-xs font-bold uppercase tracking-wider text-on-surface-variant py-2">Sat</div>
            </div>

            <!-- Calendar Days - Dynamically Generated -->
            <div id="calendar-days" class="grid grid-cols-7 gap-1 md:gap-2">
                <!-- Calendar days will be dynamically rendered here -->
            </div>
        </div>

        <!-- Upcoming Events -->
        <div id="upcoming-events-container" class="mt-12 max-w-7xl mx-auto">
            <h2 class="text-2xl font-bold text-on-surface mb-6 font-headline">Upcoming Events</h2>
            <div id="upcoming-events-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Upcoming events will be dynamically rendered here -->
            </div>
        </div>

        <!-- Legend -->
        <div class="mt-8 max-w-7xl mx-auto flex flex-wrap items-center gap-4 md:gap-6">
            <div class="flex items-center gap-2">
                <div class="w-3 h-3 rounded-full bg-primary"></div>
                <span class="text-sm text-on-surface-variant">Easy</span>
            </div>
            <div class="flex items-center gap-2">
                <div class="w-3 h-3 rounded-full bg-secondary"></div>
                <span class="text-sm text-on-surface-variant">Medium</span>
            </div>
            <div class="flex items-center gap-2">
                <div class="w-3 h-3 rounded-full bg-error"></div>
                <span class="text-sm text-on-surface-variant">Hard</span>
            </div>
        </div>
    </main>

    <!-- BottomNavBar (Mobile) -->
    <nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-6 pb-8 pt-4 md:hidden bg-white/90 backdrop-blur-2xl rounded-t-[2.5rem] shadow-[0_-10px_40px_rgba(99,102,241,0.06)] border-t border-slate-100">
        <a class="flex flex-col items-center justify-center text-slate-400" href="index.html">
            <span class="material-symbols-outlined" data-icon="home">home</span>
            <span class="text-[10px] font-medium uppercase tracking-widest mt-1">Home</span>
        </a>
        <a class="flex flex-col items-center justify-center text-slate-400" href="tasks.html">
            <span class="material-symbols-outlined" data-icon="checklist">checklist</span>
            <span class="text-[10px] font-medium uppercase tracking-widest mt-1">Tasks</span>
        </a>
        <a class="flex flex-col items-center justify-center bg-indigo-50 text-indigo-600 rounded-2xl px-5 py-2 scale-110" href="calendar.html">
            <span class="material-symbols-outlined" data-icon="event">event</span>
            <span class="text-[10px] font-medium uppercase tracking-widest mt-1">Calendar</span>
        </a>
        <a class="flex flex-col items-center justify-center text-slate-400" href="profile.html">
            <span class="material-symbols-outlined" data-icon="account_circle">account_circle</span>
            <span class="text-[10px] font-medium uppercase tracking-widest mt-1">Profile</span>
        </a>
    </nav>

    <script src="script.js"></script>
    <script defer src="/_vercel/analytics/script.js"></script>
</body>
</html>
